[package]
name = "crate-digger-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde", "js"]

[dependencies.sqlx]
version = "0.7.0"
default-features = false
features = ["macros", "migrate"]
